version: "3.8"

services:
  agent:
    build:
      context: ../../
      dockerfile: ./Cloudflare/agente-universal/agent/Dockerfile
    env_file: .env
    ports:
      - "${AGENT_PORT}:8000"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ./targets:/app/targets
      - ./policies:/app/policies
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  default:
    driver: bridge
