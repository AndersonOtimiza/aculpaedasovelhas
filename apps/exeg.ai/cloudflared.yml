# Cloudflare Tunnel Configuration
# Expõe: exeg.ai (:8000) e Bible API (:3001)
#
# SETUP:
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create exeg-ai
# 3. cloudflared tunnel route dns exeg-ai plataforma.exeg.ai
# 4. cloudflared tunnel route dns exeg-ai biblia.aculpaedasovelhas.org
# 5. cloudflared tunnel run exeg-ai

tunnel: fab88c28-772c-4ceb-b5c3-71767406fb6b
credentials-file: ~/.cloudflared/fab88c28-772c-4ceb-b5c3-71767406fb6b.json

ingress:
  # ===========================================
  # exeg.ai - Plataforma de Exegese com IA
  # ===========================================
  - hostname: plataforma.exeg.ai
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      noHappyEyeballs: true

  # ===========================================
  # Bíblia API - Tradução Belem An.C
  # ===========================================
  - hostname: biblia.aculpaedasovelhas.org
    service: http://localhost:3001
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # ===========================================
  # Fallback
  # ===========================================
  - service: http_status:404
